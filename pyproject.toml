[project]
name = "tennis-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opencv-python>=4.9",
    "pydantic>=2.0",
    "numpy>=1.26",
    "torchvision>=0.17",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "ultralytics>=8.4.21",
    "tqdm>=4.67.3",
    "scipy>=1.13",
    "onnx>=1.20.1",
    "onnxsim>=0.6.2",
    "onnxruntime>=1.24.3",
    "onnxscript>=0.6.2",
    "matplotlib>=3.10.8",
    "torch>=2.10.0",
    "synth-client",
]

[project.scripts]
train = "train_tracknet:entrypoint"
train-events = "train_eventnet:entrypoint"
train-seg = "train_seg:entrypoint"
segment = "segment_video:main"
infer = "infer_on_video:main"
webapp = "main:main"

[tool.uv.sources]
synth-client = { git = "https://gitlab.actcognitive.org/Mawlle/synth.git", subdirectory = "synth-client" }
